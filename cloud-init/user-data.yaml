#cloud-config
users:
  - default
  - name: tux
    sudo: 'ALL=(ALL) NOPASSWD:ALL'
    lock_passwd: false
    shell: /bin/bash
    plain_text_passwd: linux
    ssh_authorized_keys:
      - ssh-rsa AAA.... name@email.com
chpasswd:
  list: |
    root:linux
    sles:linux
    opensuse:linux
  expire: False
ssh_pwauth: True
bootcmd:
  - SUSEConnect -r REG_CODE
  - sysctl -w net.ipv6.conf.all.disable_ipv6=1
  - sysctl -w net.ipv6.conf.default.disable_ipv6=1
  - sysctl -w net.ipv6.conf.lo.disable_ipv6=1
  - echo "net.ipv6.conf.all.disable_ipv6=1" >> /etc/sysctl.d/99-ipv6.conf
  - echo "net.ipv6.conf.default.disable_ipv6=1" >> /etc/sysctl.d/99-ipv6.conf
  - echo "net.ipv6.conf.lo.disable_ipv6=1" >> /etc/sysctl.d/99-ipv6.conf
packages:
  - qemu-guest-agent
  - iptables
package_update: true
runcmd:
  - - systemctl
    - enable
    - --now
    - qemu-guest-agent.service
ssh_authorized_keys:
  - ssh-rsa ssh-rsa AAA.... name@email.com

